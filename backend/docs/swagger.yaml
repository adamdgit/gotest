definitions:
  api.Errors:
    properties:
      code:
        example: INTERNAL_SERVER_ERROR
        type: string
      error:
        example: Internal Server Error
        type: string
    type: object
  api.UserData:
    properties:
      email:
        type: string
      profile_url:
        type: string
      role:
        $ref: '#/definitions/models.UserRole'
    type: object
  models.UserRole:
    enum:
    - admin
    - manager
    - staff
    - member
    - customer
    type: string
    x-enum-varnames:
    - Admin
    - Manager
    - Staff
    - Member
    - Customer
info:
  contact: {}
paths:
  /api/refresh:
    post:
      consumes:
      - application/json
      description: Generates a new access token (and optionally a new refresh token)
        if the current access token is expired, using the refresh token from cookies.
        Invalidates expired sessions.
      produces:
      - application/json
      responses:
        "200":
          description: Access token refreshed
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Session expired, please log in again
          schema:
            $ref: '#/definitions/api.Errors'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Errors'
      security:
      - CookieAuth: []
      summary: Refresh access token
      tags:
      - Auth
  /user:
    get:
      description: Returns authenticated user data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserData'
        "401":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Errors'
      summary: Get current users data
      tags:
      - user
swagger: "2.0"
