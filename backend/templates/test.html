<ul class="products-list">
    {{ range .products }}
        <li>
            <a href="/product/{{ .ID }}">
                <span class="prod-name">{{ .Name }}</span>
                <span class="prod-desc">{{ .Description }}</span>
                <span class="prod-brand">{{ .Brand }}</span>
                <span class="prod-price">${{ .Price }}</span>
            </a>
        </li>
    {{ end }}
</ul>
